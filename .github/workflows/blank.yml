name: دانلود سایت یا فایل و آپلود به گیت هاب
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '🔗 لینک سایت یا فایل برای دانلود'
        required: true
        type: string
        default: ''
      zip_password:
        description: '🔒 رمز فایل (اختیاری - خالی بگذارید اگر رمز نمی‌خواهید)'
        required: false
        type: string
        default: ''
      split_size:
        description: |
          حداکثر حجم هر تکه (مگابایت)
        required: false
        type: choice
        default: '95'
        options:
          - '25  (اینترنت ضعیف)'
          - '50  (متوسط)'
          - '95  (حداکثر)'
      delete_old_archives:
        description: 'پاک کردن آرشیوهای قبلی؟'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full wget

      - name: Clean old archives
        if: ${{ github.event.inputs.delete_old_archives == 'true' }}
        run: |
          find . -maxdepth 1 -type f \( -name "*.7z.*" -o -name "*.7z" \) -exec rm -v {} \;
          find . -maxdepth 1 -type d -name "downloads" -exec rm -rf {} \;
          git rm --cached *.7z* 2>/dev/null || true
          git rm --cached -r downloads 2>/dev/null || true
          echo "Old archives cleaned."

      - name: Setup variables
        id: vars
        run: |
          SIZE=$(echo "${{ github.event.inputs.split_size }}" | grep -oP '\d+')
          echo "split_mb=${SIZE:-95}" >> $GITHUB_OUTPUT
          
          URL="${{ github.event.inputs.target_url }}"
          # Remove trailing slash if exists for consistency
          URL="${URL%/}"
          
          # Determine if it's likely a website or a direct file
          # If it ends with common file extensions, treat as file. Otherwise, treat as site.
          if [[ "$URL" =~ \.(jpg|jpeg|png|gif|pdf|zip|rar|exe|mp4|mp3|iso|dmg|tar|gz|bz2)$ ]]; then
            echo "type=file" >> $GITHUB_OUTPUT
            echo "Is likely a direct file download."
          else
            echo "type=website" >> $GITHUB_OUTPUT
            echo "Is likely a website URL."
          fi
          echo "URL: $URL"
          echo "Type: ${{ steps.vars.outputs.type }}"

      - name: Download Content
        id: download
        run: |
          URL="${{ github.event.inputs.target_url }}"
          URL="${URL%/}"
          
          mkdir -p source
          
          if [ "${{ steps.vars.outputs.type }}" == "file" ]; then
            echo "Downloading file..."
            # Get filename from URL
            FILENAME=$(basename "$URL")
            if [ -z "$FILENAME" ]; then
              FILENAME="downloaded_file"
            fi
            # Remove query params if any for naming
            FILENAME=$(echo "$FILENAME" | cut -d'?' -f1)
            
            echo "Downloading $FILENAME"
            if curl -L --fail --retry 5 --retry-delay 10 --connect-timeout 30 -o "source/$FILENAME" "$URL"; then
              echo "status=success" >> $GITHUB_OUTPUT
              echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            else
              echo "status=failed" >> $GITHUB_OUTPUT
              echo "Failed to download file."
              exit 1
            fi
          else
            echo "Downloading website..."
            # Use wget to mirror the website
            # -r: recursive
            # -k: convert links for local viewing
            # -p: download all files needed for display
            # -e robots=off: ignore robots.txt
            # --no-check-certificate: skip SSL errors
            # --timeout: connection timeout
            # --directory-prefix: where to save files
            # --convert-links: convert links in downloaded HTML to relative
            # --adjust-extension: add .html if needed
            # --page-requisites: download CSS, etc.
            # -H: span across hosts
            # --no-host-directories: don't create host directories
            # -D: domains to accept (optional, but good for limiting)
            
            SITE_NAME=$(echo "$URL" | sed 's|https\?://||' | sed 's|/.*||' | sed 's/\./_/g')
            
            wget -r -k -p -e robots=off --no-check-certificate --timeout=30 \
              --directory-prefix=source \
              --convert-links \
              --adjust-extension \
              --page-requisites \
              --no-host-directories \
              "$URL" || echo "Download finished with some warnings/errors, but proceeding..."
            
            # Clean up the top-level index.html if it was downloaded into a subfolder, 
            # but usually wget creates a folder with the domain name or puts index.html in the prefix dir.
            # Let's find the main folder created.
            # Usually it creates a folder named like the domain in the directory-prefix.
            # If it created 'source/example.com', we want to archive that.
            # If it created 'source/index.html', we want to archive the current dir content.
            
            # Check if a folder was created
            FOLDERS=$(find source -maxdepth 1 -type d -not -name "source")
            if [ -n "$FOLDERS" ]; then
              # If there's a folder, use it
              echo "Found folder: $FOLDERS"
              # Move contents up if needed or just archive the folder
              # Let's archive the specific folder created by wget
              echo "source_folder=$(echo $FOLDERS | head -n 1)" >> $GITHUB_OUTPUT
              echo "status=success" >> $GITHUB_OUTPUT
            else
              # If no folder, wget put files in source/
              echo "source_folder=source" >> $GITHUB_OUTPUT
              echo "status=success" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Archive and Split
        id: archive
        run: |
          SPLIT_MB=${{ steps.vars.outputs.split_mb }}
          PASSWORD="${{ github.event.inputs.zip_password }}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          OUTPUT_FOLDER="downloads/${TIMESTAMP}"
          mkdir -p "$OUTPUT_FOLDER"
          
          SOURCE_DIR="${{ steps.download.outputs.source_folder }}"
          
          if [ "${{ steps.vars.outputs.type }}" == "file" ]; then
            FILENAME="${{ steps.download.outputs.filename }}"
            ARCHIVE_NAME="${FILENAME%.????}"}" # Remove extension for archive name
            ARCHIVE_NAME="${ARCHIVE_NAME%.???}"
            ARCHIVE_NAME="${ARCHIVE_NAME%.??}"
            ARCHIVE_NAME="${ARCHIVE_NAME%.?}"
            ARCHIVE_NAME="${ARCHIVE_NAME:-archived_file}"
            
            echo "Archiving file: $FILENAME"
            INPUT_FILE="source/$FILENAME"
            OUTPUT_ARCHIVE="${OUTPUT_FOLDER}/${ARCHIVE_NAME}.7z"
            
          else
            echo "Archiving website: $SOURCE_DIR"
            INPUT_FILE="source/$SOURCE_DIR"
            # Get the last part of the path for the archive name
            ARCHIVE_NAME=$(basename "$INPUT_FILE")
            OUTPUT_ARCHIVE="${OUTPUT_FOLDER}/${ARCHIVE_NAME}.7z"
          fi

          if [ "${#PASSWORD}" -gt 0 ]; then
            echo "Archiving with password..."
            7z a -p"$PASSWORD" -mhe=on -mx=3 -v${SPLIT_MB}m "$OUTPUT_ARCHIVE" "$INPUT_FILE"
          else
            echo "Archiving without password..."
            7z a -mx=3 -v${SPLIT_MB}m "$OUTPUT_ARCHIVE" "$INPUT_FILE"
          fi
          
          # Clean up source
          rm -rf source
          
          echo "folder=${OUTPUT_FOLDER}" >> $GITHUB_OUTPUT
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "Archive created: $OUTPUT_ARCHIVE"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

      - name: Commit and Push
        run: |
          FOLDER="${{ steps.archive.outputs.folder }}"
          echo "Adding files from ${FOLDER}..."
          git add "${FOLDER}/"*.7z* 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            file_count=$(git diff --staged --name-only | wc -l)
            git commit -m "Add archive: ${{ steps.archive.outputs.archive_name }} (${file_count} chunks)"
            echo "Committed $file_count files."
            
            push_success=false
            max_attempts=15
            for attempt in $(seq 1 $max_attempts); do
              echo "Push attempt $attempt..."
              git pull --rebase origin main 2>/dev/null || true
              if git push origin main; then
                echo "Push successful on attempt $attempt."
                push_success=true
                break
              else
                echo "Push failed. Retrying in 20 seconds..."
                sleep 20
              fi
            done
            
            if [ "$push_success" = false ]; then
              echo "Push failed after $max_attempts attempts."
              exit 1
            fi
          else
            echo "No files to commit."
          fi

      - name: Summary
        run: |
          FOLDER="${{ steps.archive.outputs.folder }}"
          TOTAL_SIZE=$(du -sh "$FOLDER" 2>/dev/null | awk '{print $1}')
          if [ -z "$TOTAL_SIZE" ]; then TOTAL_SIZE="N/A"; fi
          
          echo ""
          echo "========================================="
          echo "Job completed!"
          echo "Archive Name: ${{ steps.archive.outputs.archive_name }}"
          echo "Split size: ${{ steps.vars.outputs.split_mb }}MB"
          echo "Folder: $FOLDER"
          echo "Total size: ${TOTAL_SIZE}"
          echo "========================================="
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          <div dir="rtl">
          ## 📊 خلاصه اجرا
          | مورد | مقدار |
          |------|-------|
          | لینک ورودی | ${{ github.event.inputs.target_url }} |
          | نوع دانلود | ${{ steps.vars.outputs.type == 'website' && 'سایت وب' || 'فایل' }} |
          | نام آرشیو | ${{ steps.archive.outputs.archive_name }} |
          | رمزگذاری | ${{ github.event.inputs.zip_password != '' && 'دارد' || 'ندارد' }} |
          | حداکثر حجم هر تکه | ${{ steps.vars.outputs.split_mb }} مگابایت |
          | حجم کل | ${TOTAL_SIZE} |
          | 📂 پوشه دانلود | [ ${FOLDER}](https://github.com/${{ github.repository }}/tree/main/${FOLDER}) |
          | وضعیت | ✅ موفق |
           ---
          ## تقدیم به همه آن‌هایی که راهی جز عبور ندارند. - [حسین بلنج](https://balanj.ir)
          </div>
          EOF
